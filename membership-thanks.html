<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Received - Potenza Lodge</title>
    <meta
      name="description"
      content="Thank you for applying for membership at Societa Nativi di Potenza Basilicata."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "potenza-green": "#1a472a",
              "potenza-red": "#8a1c1c",
              "potenza-gold": "#d4af37",
              "potenza-cream": "#f9f5f0",
              "potenza-charcoal": "#2d2d2d",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-potenza-cream text-potenza-charcoal font-sans antialiased min-h-screen flex flex-col"
  >
    <main class="flex-1 flex items-center justify-center px-6 py-16">
      <div class="max-w-lg text-center">
        <div
          class="w-16 h-16 bg-potenza-green/10 rounded-full flex items-center justify-center mx-auto mb-8"
        >
          <svg
            class="w-8 h-8 text-potenza-green"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <h1 class="font-serif text-3xl md:text-4xl font-bold text-potenza-green mb-4">
          Thank you
        </h1>
        <p class="text-gray-600 leading-relaxed mb-8">
          Your membership inquiry was sent to the lodge. A board member will follow up with next
          steps, dues, and meeting information.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
          <a
            href="index.html"
            class="inline-flex justify-center px-6 py-3 bg-potenza-green text-white font-semibold rounded shadow hover:bg-potenza-green/90 transition-colors"
            >Back to home</a
          >
          <a
            href="index.html#contact"
            class="inline-flex justify-center px-6 py-3 border-2 border-potenza-green text-potenza-green font-semibold rounded hover:bg-potenza-green hover:text-white transition-colors"
            >Contact us</a
          >
        </div>
      </div>
    </main>
    <footer class="py-6 text-center text-xs text-gray-500">
      <p>
        &copy; <span id="ty-year"></span> Societa Nativi di Potenza Basilicata
      </p>
    </footer>
    <script>
      document.getElementById("ty-year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
